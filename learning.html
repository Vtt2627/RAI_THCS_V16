<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>RAI-THCS - Lộ trình học tập cá nhân hóa</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <canvas id="bg-canvas-3d"></canvas>
        <div class="container" style="max-width: 900px;">
            <h1>LỘ TRÌNH HỌC TẬP CÁ NHÂN HÓA</h1>
            <div id="learningMessage" style="margin-bottom: 20px; color: #7dd3fc; font-weight: 600; font-size: 18px; text-align: center;"></div>
            
            <div id="lessonContainer"></div>

            <div class="container" style="margin-top: 25px; background: rgba(15, 23, 42, 0.95);">
                <h3>HỎI ĐÁP TRỰC TIẾP VỚI TRỢ LÝ AI</h3>
                <div id="chatBox" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;"></div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="userQuery" placeholder="Hỏi AI về bất kỳ thắc mắc nào trong bài học..." style="margin-top:0;">
                    <button id="sendQueryBtn">Gửi</button>
                </div>
            </div>
            
            <p style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #94a3b8;">← Quay lại trang chủ đánh giá</a>
            </p>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="background.js"></script>
        <script src="data.js"></script>
        <script src="learning.js"></script>
    </body>
</html>
